<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English widget</title>
  <link rel="stylesheet" href="style.css?v=30">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="topbar" hidden></div>
  <div id="views">
    <!-- Учить -->
    <main id="learn" class="view">
      <header class="hdr">
        <div class="goalbox">
          <div class="goaltext"><span id="goalLabel" class="muted">Сегодня:</span> <b id="goalNum">0/20</b></div>
          <div class="track"><i id="goalFill"></i></div>
        </div>
        <div id="streakChip" class="chip" title="Дней подряд"><span class="flame-slot"></span><b id="streakNum">0</b></div>
        <button id="chipMore" class="icon small chipmore" aria-label="Настройки серии" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg></button>
      </header>

      <div class="timer">
        <div class="track"><i id="timerFill"></i></div>
        <span id="countdown" class="muted"></span>
      </div>

      <div class="glass">
        <div class="row top">
          <div id="tag"></div>
          <button id="favBtn" class="icon" aria-label="Сохранить в закладки">
            <svg viewBox="0 0 24 24" width="30" height="30"><path d="M7 3.5h10a1.2 1.2 0 0 1 1.2 1.2V20.5L12 15.2l-6.2 5.3V4.7A1.2 1.2 0 0 1 7 3.5z"/><path class="mark-fill" d="M7 3.5h10a1.2 1.2 0 0 1 1.2 1.2V20.5L12 15.2l-6.2 5.3V4.7A1.2 1.2 0 0 1 7 3.5z"/></svg>
          </button>
        </div>

        <div id="prompt"></div>

        <div class="row entryrow">
          <input id="entry" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="done" aria-label="Ваш ответ">
          <button id="hintBtn" class="hintbtn" aria-label="Подсказка: открыть первые буквы ответа" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
          </button>
        </div>
        <button id="checkBtn" class="btn primary wide">Проверить</button>
        <button id="endSessBtn" class="btn small" hidden>Прекратить повтор</button>

        <div id="status" role="status"></div>
        <div id="answer" aria-live="polite"></div>
        <div id="example" class="muted"></div>

        <div id="actions" class="row wrap">
          <button id="knownBtn" class="btn primary" hidden>Уже знал</button>
          <button id="easyBtn" class="btn" hidden>Легко</button>
          <button id="normalBtn" class="btn" hidden>Нормально</button>
          <button id="hardBtn" class="btn" hidden>Трудно</button>
        </div>

        <div class="row bottom">
          <button id="modeBtn" class="icon" aria-label="Что учить: выбрать виды">
            <svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg>
          </button>
        </div>
      </div>

      <div class="row nav">
        <button id="backBtn" class="btn" aria-label="Назад">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button id="nextBtn" class="btn primary grow">Далее</button>
        <button id="showBtn" class="btn">Показать ответ</button>
      </div>
    </main>

    <!-- Больше: блоки разделов (Настройки, Игры, Прогресс, Достижения, Времена, Повтор, Словарь) -->
    <section id="more" class="view" hidden>
      <h1>Больше</h1>
      <div id="moreBody" class="list">
        <button class="item tplace" data-go="general"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M10.37 5.19L10.72 2.49L13.28 2.49L13.63 5.19L15.66 6.03L17.82 4.37L19.63 6.18L17.97 8.34L18.81 10.37L21.51 10.72L21.51 13.28L18.81 13.63L17.97 15.66L19.63 17.82L17.82 19.63L15.66 17.97L13.63 18.81L13.28 21.51L10.72 21.51L10.37 18.81L8.34 17.97L6.18 19.63L4.37 17.82L6.03 15.66L5.19 13.63L2.49 13.28L2.49 10.72L5.19 10.37L6.03 8.34L4.37 6.18L6.18 4.37L8.34 6.03z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.1"/></svg></span><span class="ttxt"><span class="mtitle">Настройки</span><span class="tsub muted">Серия, звук, фон, время на ответ</span></span><svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <div class="tgrid">
          <button class="item tcell" data-go="games"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 4H16A5.6 5.6 0 0 1 21.6 9.7L22.1 16A3.7 3.7 0 0 1 16 18.7L14.5 16.3H9.5L8 18.7A3.7 3.7 0 0 1 1.9 16L2.4 9.7A5.6 5.6 0 0 1 8 4Z"/><path d="M7.7 9v4.2M5.6 11.1h4.2"/><path d="M16 9.7h.02M18.4 12.3h.02" stroke-width="2.6"/></svg></span><span class="tname">Игры</span><span class="tstat" id="mstGames"></span></button>
          <button class="item tcell" data-go="prog"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3.4 2.8v18h18" stroke-width="1.5"/><g class="parrow"><path d="M7.4 12.6C10 11.8 12.9 9.9 15.3 7.6" stroke-width="1.9"/><path d="M18 4.6l-3.9.9 2.9 2.9z" fill="currentColor" stroke-width=".7"/></g><rect x="6.2" y="16.9" width="2.2" height="3.1" rx=".8" fill="currentColor" stroke="none"/><rect x="9.2" y="15.3" width="2.2" height="4.7" rx=".8" fill="currentColor" stroke="none"/><rect x="12.2" y="13.3" width="2.2" height="6.7" rx=".8" fill="currentColor" stroke="none"/><rect x="15.2" y="11.1" width="2.2" height="8.9" rx=".8" fill="currentColor" stroke="none"/><rect x="18.2" y="8.9" width="2.2" height="11.1" rx=".8" fill="currentColor" stroke="none"/></svg></span><span class="tname">Прогресс</span><span class="tstat" id="mstProg"></span><i class="rdot" id="dotProg" hidden aria-hidden="true"></i></button>
          <button class="item tcell" data-go="ach"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 4h8v5.2a4 4 0 0 1-8 0z"/><path d="M8 6H4.6v1.4A3.2 3.2 0 0 0 8 10.6M16 6h3.4v1.4a3.2 3.2 0 0 1-3.4 3.2"/><path d="M12 13.2V17M8.6 20h6.8M10 17h4"/></svg></span><span class="tname">Достижения</span><span class="tstat" id="mstAch"></span><i class="rdot" id="dotAch" hidden aria-hidden="true"></i></button>
          <button class="item tcell" data-go="tenses"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="tname">Времена</span><span class="tstat" id="mstTenses"></span></button>
          <button class="item tcell" data-go="rev"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></svg></span><span class="tname">Повтор</span><span class="tstat" id="mstRev"></span><i class="rdot" id="dotRev" hidden aria-hidden="true"></i></button>
          <button class="item tcell" id="dictRow"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M9.5 3v18M13 8h3.5"/></svg></span><span class="tname">Словарь</span><span class="tstat" id="mstDict"></span></button>
          <button class="item tcell" id="aiRow" aria-haspopup="dialog"><span class="mico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M10.5 3.5l1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7z"/><path d="M18.2 14.8l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span><span class="tname">Donald Ai</span><span class="tstat">beta</span></button>
        </div>
      </div>
    </section>

    <!-- Настройки (бывшие «Общие») -->
    <section id="general" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Настройки</h1></div>
      <div id="generalBody" class="list"></div>
      <div id="generalNote" class="gnote"></div>
    </section>

    <!-- Времена -->
    <section id="tenses" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Времена</h1></div>
      <div id="tensesBody" class="list"></div>
    </section>

    <section id="tlesson" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="tenses" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Урок</h1></div>
      <div id="tlessonBody" class="list"></div>
    </section>

    <!-- Повтор -->
    <section id="rev" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Повтор</h1></div>
      <div id="revBody" class="list"></div>
    </section>

    <!-- Игры -->
    <section id="games" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Игры</h1></div>
      <div id="gamesBody" class="list"></div>
    </section>

    <!-- Достижения -->
    <section id="ach" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Достижения</h1><button id="achSearchBtn" class="icon small" aria-label="Поиск по достижениям" aria-expanded="false" aria-controls="achSearchWrap"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div>
      <div id="achSearchWrap" class="searchwrap" hidden>
        <input id="achSearch" class="search" type="search" placeholder="Поиск по достижениям" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Поиск по достижениям">
      </div>
      <div id="achBody" class="list"></div>
    </section>

    <!-- Переводчик: перевод идёт сам, пока печатаешь (кнопки «Перевести» нет) -->
    <section id="tr" class="view" hidden>
      <h1>Переводчик</h1>
      <div class="trpair">
      <div class="trcard">
        <div class="trhead">
          <span id="trFrom" class="trlabel">Русский</span>
          <span class="trbtns">
            <button id="trPhoto" class="trx" aria-label="Перевести текст с фото (камера или галерея)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9a2.5 2.5 0 0 1 2.5-2.5h1.2L9 4.5h6l1.3 2h1.2A2.5 2.5 0 0 1 20 9v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17z"/><circle cx="12" cy="12.7" r="3.3"/></svg></button>
            <button id="trClear" class="trx" aria-label="Стереть текст" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7M6.5 7l.8 11.6a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7M10 11v6M14 11v6"/></svg></button>
          </span>
          <input id="trFile" type="file" accept="image/*" hidden>
        </div>
        <textarea id="trInput" class="trtext" rows="4" maxlength="500" placeholder="Введите текст" aria-label="Текст для перевода"
                  autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
        <div class="trcount muted"><span id="trCount">0</span>/500</div>
      </div>
      <button id="trSwap" class="trswap" aria-label="Поменять направление перевода"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M8 4v16M4.5 16.5L8 20l3.5-3.5M16 20V4M12.5 7.5L16 4l3.5 3.5"/></svg></button>
      <div class="trcard trdst">
        <div class="trhead">
          <span id="trTo" class="trlabel">English</span>
          <span id="trStatus" class="trstatus muted"><span class="trshim">Перевожу…</span></span>
        </div>
        <div id="trResult" class="trresult" data-ph="Перевод появится здесь" aria-live="polite"></div>
        <p id="trErr" class="trerr" role="alert" hidden></p>
        <div id="trFoot" class="trfoot" hidden><span class="muted">Перевод: DeepL</span><button id="trCopy" class="trx" aria-label="Скопировать перевод"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3.5" y="8.5" width="12" height="12" rx="3.2"/><path d="M8.5 8.3V6.7a3.2 3.2 0 0 1 3.2-3.2h5.6a3.2 3.2 0 0 1 3.2 3.2v5.6a3.2 3.2 0 0 1-3.2 3.2h-1.6"/></svg></button></div>
      </div>
      </div>
    </section>

    <!-- Инвентарь -->
    <section id="inv" class="view" hidden>
      <h1>Инвентарь</h1>
      <div class="seg">
        <button class="segbtn" data-tab="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1.2 1.2 0 0 1 1.2 1.2V20.5L12 15.2l-6.2 5.3V4.7A1.2 1.2 0 0 1 7 3.5z"/></svg>Закладки</button>
        <button class="segbtn" data-tab="hard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21L21 5"/><circle cx="14" cy="5.6" r="4.3"/><g stroke-width="1.4"><path d="M12.7 4.4a1.5 1.5 0 1 1 2.2 1.3c-.6.35-.9.7-.9 1.4"/><path d="M14 8.5v.01"/></g><circle cx="7.1" cy="6.6" r="1.6"/><path d="M6.6 9.8L4.8 13.8 8 15.9M4.8 13.8L3.5 19.7M6.7 10.1L10.1 7"/></svg>Трудные</button>
        <button class="segbtn" data-tab="dict"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M9.5 3v18M13 8h3.5"/></svg>Словарь</button>
        <button class="segbtn" data-tab="mastered"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Выучено</button>
      </div>
      <div class="invsrow">
        <input id="invSearch" class="search" type="search" placeholder="Поиск по слову" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Поиск по слову">
        <button id="favFilterBtn" class="favfbtn" hidden aria-label="Фильтр" aria-expanded="false" aria-controls="favFilters"><svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg></button>
      </div>
      <div id="dictKinds" class="dkinds" role="group" aria-label="Показывать только" hidden></div>
      <div id="favFilters" class="favfilters" hidden>
        <div id="favKinds" class="dkinds" role="group" aria-label="Закладки: только вид"></div>
        <div id="favLevels" class="dkinds" role="group" aria-label="Закладки: только уровень"></div>
      </div>
      <div id="invBody" class="list"></div>
    </section>

    <!-- Прогресс -->
    <section id="prog" class="view" hidden>
      <div class="subhead"><button class="icon small" data-go="more" aria-label="Назад"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Прогресс</h1></div>
      <div id="progBody" class="list"></div>
    </section>
  </div>

  <div id="spopWrap" class="spopwrap" hidden><div id="spop" class="spop" role="dialog" aria-label="Дневная серия" tabindex="-1"></div></div>

  <div id="sheet" class="sheet" hidden><div id="sheetBox" class="sheetbox" role="dialog" aria-modal="true" tabindex="-1"></div></div>

  <nav id="bar">
    <button class="tabbtn on" data-view="learn" aria-current="page">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 7C9.6 5.3 6.6 4.8 3 5.2V18.2c3.6-.4 6.6.1 9 1.8 2.4-1.7 5.4-2.2 9-1.8V5.2C17.4 4.8 14.4 5.3 12 7z"/><path d="M12 7v13"/></svg>
      <span>Учить</span>
    </button>
    <button class="tabbtn" data-view="inv">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>
      <span>Инвентарь</span>
    </button>
    <button class="tabbtn" data-view="tr">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M3.5 5.5h9M8 3.5v2M5.5 5.5c.6 3.4 2.8 6.2 6 8M10.5 5.5c-.6 3.4-2.8 6.2-6 8"/><path d="M12 21l4.2-9.5L20.5 21M13.8 17.5h4.8"/></svg>
      <span>Переводчик</span>
    </button>
    <button class="tabbtn" data-view="more">
      <svg viewBox="0 0 24 24" width="30" height="30"><rect x="4" y="4" width="6.6" height="6.6" rx="2"/><rect x="13.4" y="4" width="6.6" height="6.6" rx="2"/><rect x="4" y="13.4" width="6.6" height="6.6" rx="2"/><rect x="13.4" y="13.4" width="6.6" height="6.6" rx="2"/></svg>
      <span>Больше</span>
    </button>
  </nav>

  <script type="module" src="app.js?v=30"></script>
</body>
</html>
